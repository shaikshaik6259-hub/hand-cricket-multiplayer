<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hand Cricket Multiplayer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>🏏 Hand Cricket</h1>

        <h2>Multiplayer</h2>


        <div class="card">

            <h3>Create Game</h3>

            <input
                type="text"
                id="createName"
                placeholder="Enter your name"
            >

            <button onclick="createRoom()">
                Create Room
            </button>

        </div>


        <div class="card">

            <h3>Join Game</h3>

            <input
                type="text"
                id="joinName"
                placeholder="Enter your name"
            >

            <input
                type="text"
                id="roomId"
                placeholder="Enter room code"
            >

            <button onclick="joinRoom()">
                Join Room
            </button>

        </div>


        <p id="message"></p>

    </div>


    <script src="/socket.io/socket.io.js"></script>

    <script src="js/main.js"></script>

</body>

</html>
